<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Neon Lime to Cyan Kinetic Gradient -->
    <linearGradient id="kineticGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>

    <!-- Glowing accent -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#glowGrad)" stroke-width="4" opacity="0.35" />

  <!-- Delta Kinetic Geometry (Athletic Delta / Chevron with cuts) -->
  <g transform="translate(256, 215)" filter="url(#glow)">
    <!-- Outer Delta Wings / Chevron Segments -->
    <!-- Left Ascending Wing -->
    <polygon points="-110,80 -140,80 -40,-120 0,-120 -80,40 -45,40 -65,80" fill="url(#kineticGrad)" />
    <!-- Right Ascending Wing -->
    <polygon points="110,80 140,80 40,-120 0,-120 80,40 45,40 65,80" fill="url(#kineticGrad)" />
    
    <!-- Central Inner Chevron / Forward Arrow -->
    <path d="M 0,-60 L 60,50 L 32,50 L 0,-12 L -32,50 L -60,50 Z" fill="#ffffff" opacity="0.95" />

    <!-- Dynamic Speed Accent Slits -->
    <line x1="-125" y1="96" x2="-45" y2="96" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
    <line x1="45" y1="96" x2="125" y2="96" stroke="#84cc16" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Typography: KINETIX -->
  <text x="256" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="8">KINETIX</text>
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10b981" letter-spacing="4">PERFORMANCE</text>
</svg>
