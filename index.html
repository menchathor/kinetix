<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Kinetix: entrenamiento de fuerza, nutrición y evolución corporal, local-first y offline.">
  <title>Kinetix • Entrenamiento & Recomposición</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kinetix">
  <link rel="icon" type="image/png" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">

  <!-- Aplicar el tema antes del primer paint para evitar flash claro/oscuro.
       El tema claro es el predeterminado; si hay una preferencia guardada, gana. -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('kinetix_theme') || localStorage.getItem('smartfit_theme') || 'light';
        var isDark = theme === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', isDark ? '#090d16' : '#f8fafc');
      } catch (e) {}
    })();
  </script>

  <!-- CSS compilado localmente (sin CDN en producción) -->
  <link rel="stylesheet" href="./assets/css/tailwind.css">

  <!-- Chart.js fijado a una versión local para funcionar offline -->
  <script defer src="./assets/vendor/chart.umd.min.js"></script>

  <style>
    :root {
      --background: #f8fafc;
      --card: #ffffff;
      --card-subtle: #f1f5f9;
      --border: #e2e8f0;
      --accent: #f1f5f9;
      --foreground: #0f172a;
      --muted-foreground: #475569;
      --primary: #f59e0b;
      --primary-foreground: #020617;
      --header-bg: rgba(248, 250, 252, 0.92);
      --nav-bg: rgba(255, 255, 255, 0.95);
    }

    /* Tema claro: los acentos 400/500 no alcanzan 4.5:1 sobre fondos
       claros; usamos tonos 600/700 sólo cuando el tema claro está activo. */
    html:not(.dark) .text-amber-400,
    html:not(.dark) .text-amber-500 { color: #92400e !important; }
    html:not(.dark) .text-emerald-400,
    html:not(.dark) .text-emerald-500 { color: #047857 !important; }
    html:not(.dark) .text-blue-400,
    html:not(.dark) .text-blue-500 { color: #1d4ed8 !important; }
    html:not(.dark) .text-rose-400,
    html:not(.dark) .text-rose-500 { color: #be123c !important; }
    html:not(.dark) .text-purple-400,
    html:not(.dark) .text-purple-500 { color: #7e22ce !important; }
    html:not(.dark) .text-teal-400,
    html:not(.dark) .text-teal-500 { color: #0f766e !important; }
    html:not(.dark) .text-cyan-400,
    html:not(.dark) .text-cyan-500 { color: #0e7490 !important; }

    html.dark {
      --background: #090d16;
      --card: #111827;
      --card-subtle: #1e293b;
      --border: #1f2937;
      --accent: #1e293b;
      --foreground: #f8fafc;
      --muted-foreground: #94a3b8;
      --primary: #f59e0b;
      --primary-foreground: #020617;
      --header-bg: rgba(9, 13, 22, 0.90);
      --nav-bg: rgba(9, 13, 22, 0.95);
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Permitir seleccionar y copiar texto (notas, comidas, etc.) */
    input, select, textarea, button {
      font-family: inherit;
    }
    input, select, textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    /* Los steppers de series usan sus propios botones +/-; ocultamos los
       spinners nativos para ganar ancho para los decimales. */
    .input-set-field::-webkit-outer-spin-button,
    .input-set-field::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .input-set-field {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    /* iOS hace zoom al enfocar inputs con fuente < 16px; evitarlo sin
       bloquear el zoom del usuario (accesibilidad). */
    @media (max-width: 640px) {
      /* Campos compactos en móvil. La especificidad gana a text-xs sin
         necesidad de !important. En iOS esto puede activar el zoom al
         enfocar; si ocurre, se puede subir sólo ese caso a 16px. */
      input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not(.input-set-field),
      select:not([multiple]),
      textarea:not([disabled]) {
        font-size: 12px;
        min-height: 2.25rem;
      }

      /* Los steppers de la fila de series tienen su propia altura. */
      .input-set-field {
        min-height: 0;
      }

      /* Piso de legibilidad: las etiquetas de 9/10px suben a 11px. */
      .text-\[9px\],
      .text-\[10px\] {
        font-size: 11px !important;
        line-height: 1.25;
      }
    }

    @media (min-width: 360px) and (max-width: 640px) {
      input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not(.input-set-field),
      select:not([multiple]),
      textarea:not([disabled]) {
        min-height: 2.5rem;
      }
    }

    /* Safe area padding for iPhones with notch / home bar */
    .safe-bottom {
      padding-bottom: max(env(safe-area-inset-bottom, 16px), 16px);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-[var(--background)] text-[var(--foreground)] flex flex-col antialiased transition-colors duration-200">

  <!-- TOP APP BAR -->
  <header class="sticky top-0 z-40 bg-[var(--header-bg)] backdrop-blur-md border-b border-[var(--border)] px-4 py-3 transition-colors duration-200">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <img src="./assets/icons/icon-192.png" alt="Kinetix Logo" class="w-8 h-8 rounded-xl border border-[var(--border)] shadow-xs object-cover" />
        <div>
          <h1 class="text-sm font-extrabold tracking-tight text-[var(--foreground)] flex items-center gap-1.5">
            <span id="appTitleHeader">Kinetix</span>
            <span id="headerGymTime" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-500 border border-amber-500/30">18:00</span>
            <span id="headerVersionBadge" class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400 border border-emerald-500/25">v1.17</span>
          </h1>
          <p id="headerSubtitle" class="text-[10px] text-[var(--muted-foreground)]">Recomposición Corporal • 72-74 kg</p>
        </div>
      </div>

      <!-- Action Buttons: Theme Toggle & Avatar -->
      <div class="flex items-center gap-2">
        <button id="btnThemeToggle" class="w-8 h-8 rounded-xl bg-[var(--accent)] text-[var(--foreground)] border border-[var(--border)] flex items-center justify-center text-sm shadow-xs hover:bg-[var(--border)] transition-colors" title="Cambiar Modo Claro / Oscuro" aria-label="Cambiar entre modo claro y oscuro">
          <span id="themeIcon" aria-hidden="true">☀️</span>
        </button>
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-500 to-emerald-500 text-slate-950 font-black text-xs flex items-center justify-center shadow-xs">
          MM
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN SCROLLABLE CONTENT (Montado dinámicamente por app.js) -->
  <main id="mainContent" class="flex-1 p-4 pb-28 max-w-3xl mx-auto w-full">
    <!-- Contenido SPA inyectado por JS -->
  </main>

  <!-- TEMPORIZADOR DE DESCANSO FLOTANTE -->
  <div id="floatingTimer" class="hidden fixed bottom-20 right-4 z-50 bg-[var(--card)]/95 backdrop-blur-md border border-amber-500/40 rounded-2xl p-3 shadow-2xl max-w-xs w-64 transition-all">
    <div class="flex items-center justify-between mb-1.5">
      <div class="flex items-center gap-1.5">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-500"></span>
        </span>
        <span class="text-[11px] uppercase font-bold text-amber-500">Descanso</span>
      </div>
      <div class="flex items-center gap-1">
        <button id="btnTimerAdd15" class="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded bg-[var(--accent)] text-[var(--foreground)] hover:bg-[var(--border)]" title="Sumar 15 segundos" aria-label="Sumar 15 segundos al descanso">+15s</button>
        <button id="btnTimerTogglePlay" class="text-xs px-2 py-0.5 rounded bg-[var(--accent)] text-[var(--foreground)] hover:bg-[var(--border)]" aria-label="Pausar o reanudar el descanso">⏸</button>
        <button id="btnTimerClose" class="text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)] pl-1" aria-label="Cerrar el temporizador">✕</button>
      </div>
    </div>

    <!-- Contador Digital -->
    <div class="text-center my-1">
      <span id="timerTextDisplay" role="timer" aria-live="polite" class="font-mono text-2xl font-black tracking-wider text-[var(--foreground)]">01:30</span>
    </div>

    <!-- Barra de progreso -->
    <div class="w-full h-1.5 bg-[var(--accent)] rounded-full overflow-hidden">
      <div id="timerProgressBar" class="h-full bg-gradient-to-r from-amber-500 to-emerald-400 transition-all duration-300 rounded-full" style="width: 100%"></div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION BAR (Sticky) -->
  <nav aria-label="Navegación principal" class="fixed bottom-0 left-0 right-0 z-40 bg-[var(--nav-bg)] backdrop-blur-lg border-t border-[var(--border)] safe-bottom transition-colors duration-200">
    <div class="max-w-md mx-auto grid grid-cols-4 px-2 py-1">
      
      <!-- Pestaña 1: Rutina / Entrenamiento -->
      <button class="nav-tab-btn flex flex-col items-center justify-center py-1 text-amber-500 transition-all" data-tab="workout">
        <span class="nav-icon text-lg">🏋️</span>
        <span class="nav-label text-[10px] font-bold mt-0.5">Rutina</span>
      </button>

      <!-- Pestaña 2: Nutrición -->
      <button class="nav-tab-btn flex flex-col items-center justify-center py-1 text-[var(--muted-foreground)] transition-all" data-tab="nutrition">
        <span class="nav-icon text-lg">🥗</span>
        <span class="nav-label text-[10px] mt-0.5">Nutrición</span>
      </button>

      <!-- Pestaña 3: Evolución -->
      <button class="nav-tab-btn flex flex-col items-center justify-center py-1 text-[var(--muted-foreground)] transition-all" data-tab="analytics">
        <span class="nav-icon text-lg">📈</span>
        <span class="nav-label text-[10px] mt-0.5">Evolución</span>
      </button>

      <!-- Pestaña 4: Ajustes -->
      <button class="nav-tab-btn flex flex-col items-center justify-center py-1 text-[var(--muted-foreground)] transition-all" data-tab="settings">
        <span class="nav-icon text-lg">⚙️</span>
        <span class="nav-label text-[10px] mt-0.5">Ajustes</span>
      </button>

    </div>
  </nav>

  <!-- Main JavaScript Module -->
  <script type="module" src="./js/app.js?v=1.17"></script>
</body>
</html>
